[mypy]
# Casting Simulation - MyPy Configuration
# ========================================

# Python version target
python_version = 3.10

# Path settings
mypy_path = .
files = core/simulation_pipeline.py, core/analysis_strategies.py, core/solidification_loop.py, web/app_factory.py, web/routes.py, web/services/simulation_queue.py, web/repository.py, ui/workers.py, ui/dialogs/base.py

# ========================================
# Strictness Settings
# ========================================

# Refactor gate: practical baseline while legacy modules are migrated
strict = false

# Additional strict checks
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = false

# Disallow dynamic typing
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false

# Function definitions
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

# None and Optional handling
no_implicit_optional = true
strict_optional = true

# ========================================
# Error Handling
# ========================================

show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true

# Error output format
error_summary = true

# ========================================
# Import Settings
# ========================================

# Follow imports
follow_imports = skip
follow_imports_for_stubs = true

# Namespace packages
namespace_packages = true
explicit_package_bases = true

# ========================================
# Caching
# ========================================

cache_dir = .mypy_cache
incremental = true
skip_cache_mtime_checks = false

# ========================================
# Plugins
# ========================================

plugins = numpy.typing.mypy_plugin

# ========================================
# Per-Module Overrides
# ========================================

# Third-party libraries without stubs
[mypy-vtk.*]
ignore_missing_imports = true

[mypy-PyQt5.*]
ignore_missing_imports = true

[mypy-flask_cors.*]
ignore_missing_imports = true

[mypy-numba.*]
ignore_missing_imports = true

[mypy-trimesh.*]
ignore_missing_imports = true

[mypy-stl.*]
ignore_missing_imports = true

[mypy-psutil.*]
ignore_missing_imports = true

[mypy-joblib.*]
ignore_missing_imports = true

[mypy-tqdm.*]
ignore_missing_imports = true

[mypy-matplotlib.*]
ignore_missing_imports = true

[mypy-PIL.*]
ignore_missing_imports = true

[mypy-weasyprint.*]
ignore_missing_imports = true

[mypy-pdfkit.*]
ignore_missing_imports = true

[mypy-cupy.*]
ignore_missing_imports = true

[mypy-pyopencl.*]
ignore_missing_imports = true

# Legacy code modules (relaxed checking during migration)
[mypy-core.solidification]
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_errors = true

[mypy-core.thermal_solver]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[mypy-core.voxel_mesh]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[mypy-core.thermal_simulation]
ignore_errors = false

[mypy-core.acceleration]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[mypy-core.convection]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[mypy-core.gpu_compute]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[mypy-core.memory_manager]
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_errors = true

[mypy-core.*]
ignore_errors = true

[mypy-core.simulation_pipeline]
ignore_errors = false

[mypy-ui.main_window]
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_errors = true

[mypy-ui.visualizer]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[mypy-ui.*]
ignore_errors = true

[mypy-physics.*]
ignore_errors = true

[mypy-config.*]
ignore_errors = true

[mypy-physics.shrinkage]
ignore_errors = true

[mypy-physics.niyama]
ignore_errors = true

# Test files (more relaxed)
[mypy-tests.*]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
