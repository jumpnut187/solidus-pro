# Regression check. Logic lives in scripts/ci/ so a later GitLab pipeline
# (.gitlab-ci.yml) can run the same commands; keep this file a thin wrapper.
name: ci

on:
  pull_request:
    paths-ignore: # keep in sync with push.paths-ignore
      - "**/*.md"
      - "docs/**"
      - "**/*.xlsx"
      - "**/*.html"
      - "**/*.pdf"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/*.xlsx"
      - "**/*.html"
      - "**/*.pdf"
      - "LICENSE"
  workflow_dispatch:

# One run per PR (a new push cancels the old run). Pushes to main each get
# their own run so every main commit has a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # Pinned image, not ubuntu-latest: PySide6 6.11 needs glibc >= 2.34.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-core.txt
            constraints-ci.txt

      - name: Install
        run: scripts/ci/install.sh

      - name: Dependency pins
        run: scripts/ci/check.sh pins

      - name: Syntax
        run: scripts/ci/check.sh syntax

      - name: Type check (advisory)
        # Not a gate yet: the mypy.ini allowlist has pre-existing errors.
        # Remove continue-on-error once `scripts/ci/check.sh types` is clean.
        continue-on-error: true
        run: scripts/ci/check.sh types

      - name: Regression suite
        run: scripts/ci/check.sh tests
