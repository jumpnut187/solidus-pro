name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # ui/ tests import PyQt5 and VTK; there is no display on the runner.
      QT_QPA_PLATFORM: offscreen
      # Keep Numba's thread pool small and deterministic on shared runners.
      CASTSIM_NUMBA_THREADS: "2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system libraries for VTK and Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglx-mesa0 libglu1-mesa libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libegl1

      - name: Install Python dependencies
        # Deliberately not the whole of requirements.txt. torch, coremltools,
        # onnx and onnx2tf are large and Apple-oriented; the deep-model and
        # surrogate export tests skip cleanly when torch is absent, so the core
        # physics, pipeline and web suites still run. Revisit if the ML paths
        # need CI coverage.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.24.0" "scipy>=1.10.0" "numba>=0.57.0" \
            "trimesh>=3.21.0" "numpy-stl>=3.0.1" "rtree>=0.9.7" \
            "psutil>=5.9.5" "joblib>=1.3.0" "matplotlib>=3.7.0" "tqdm>=4.65.0" \
            "pandas>=1.5.0" "scikit-learn>=1.3.0" \
            "PyQt5>=5.15.9" "vtk>=9.2.6" \
            "Flask>=3.0.0" "Flask-CORS>=4.0.0" "Werkzeug>=3.0.0" \
            "PyYAML>=6.0.1" "toml>=0.10.2" "Jinja2>=3.1.2" "Pillow>=10.0.0" \
            "typing-extensions>=4.8.0" \
            mypy

      - name: Syntax check
        run: python -m compileall -q config core physics ui web tests

      - name: Type check (advisory)
        # Advisory, not blocking: mypy currently exits 1 with 44 pre-existing
        # errors, all in web/services/simulation_queue.py. Make this a hard gate
        # once that baseline is clean, so new type errors cannot land silently.
        #
        # mypy.ini `files=` is an explicit allowlist and most modules are
        # ignore_errors = true, so adding a file to that list is what makes it
        # checked at all.
        continue-on-error: true
        run: python -m mypy --config-file mypy.ini

      - name: Regression suite
        # Must exit 0. This job exists because a heap-corrupting out-of-bounds
        # write in a Numba kernel once made `discover` exit 139, and the
        # resulting crash hid eight further failures for weeks.
        run: python -m unittest discover tests
