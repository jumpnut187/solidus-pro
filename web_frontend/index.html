<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Solidus Pro - casting solidification and mold-filling simulation."
    />
    <title>Solidus Pro</title>
    <!-- Inline so there is no extra request and no 404 for a missing file. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0d12'/%3E%3Cpath d='M16 5c4.2 4.6 7 8.2 7 11.8A7 7 0 0 1 9 16.8C9 13.2 11.8 9.6 16 5z' fill='%23ff8a3d'/%3E%3Cpath d='M16 13c1.9 2.2 3.1 3.8 3.1 5.4a3.1 3.1 0 1 1-6.2 0c0-1.6 1.2-3.2 3.1-5.4z' fill='%23ffd08a'/%3E%3C/svg%3E"
    />
    <!--
      No web font is loaded on purpose. The app runs on shop-floor machines and
      in offline environments, and a blocking request to a font CDN buys a
      first-paint delay (and a console error when it fails) in exchange for a
      typeface the system stack already matches. `--font` prefers a locally
      installed Inter and falls back to the platform UI face.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
