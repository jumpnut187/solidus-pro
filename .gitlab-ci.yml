# Solidus Pro CI pipeline
# Python (Flask + PySide6 engine) and React/TypeScript frontend (web_frontend/).
# Verify commands follow AGENT.md and README.md ("Testing" section).

stages:
  - lint
  - test
  - build

# Run pipelines for merge requests and the default branch only.
# Avoids duplicate branch + MR pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  # A newer push cancels the superseded pipeline (safe: no deploy jobs).
  interruptible: true

variables:
  # Keep package caches inside the project dir so GitLab can cache them.
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

# ---------------------------------------------------------------------------
# Hidden base jobs
# ---------------------------------------------------------------------------

# Python 3.13 is the "CI version" per README.md.
.python-base:
  image: python:3.13
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip

# Python base with full dependencies installed.
.python-deps:
  extends: .python-base
  before_script:
    # Qt/VTK wheels need these shared libraries even when running offscreen.
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libxrender1
    # Install CPU-only torch first (avoids multi-GB CUDA wheels). requirements.txt
    # asks for torch>=2.6.0, which is then already satisfied.
    - pip install torch --index-url https://download.pytorch.org/whl/cpu
    - pip install -r requirements.txt

# Node base for web_frontend/. The lockfile keys the npm cache.
.frontend-base:
  image: node:22
  cache:
    key:
      files:
        - web_frontend/package-lock.json
    paths:
      - .cache/npm
  before_script:
    - cd web_frontend
    - npm ci --prefer-offline

# ---------------------------------------------------------------------------
# lint
# ---------------------------------------------------------------------------

# Fast syntax pass. Needs no third-party packages, so no dependency install.
python-compile:
  extends: .python-base
  stage: lint
  needs: []
  script:
    - python -m compileall -q config core physics ui web

# CAD files may only be committed as CI test models (tests/ci_models/*.stl).
cad-files:
  extends: .python-base
  stage: lint
  needs: []
  script:
    - scripts/ci/check.sh models

# Type check limited to the files= allowlist in mypy.ini.
python-mypy:
  extends: .python-deps
  stage: lint
  needs: []
  script:
    - pip install mypy
    - python -m mypy --config-file mypy.ini
  # Not yet verified green on a clean runner. Remove once the first run passes.
  allow_failure: true

frontend-lint:
  extends: .frontend-base
  stage: lint
  needs: []
  script:
    - npm run lint

# ---------------------------------------------------------------------------
# test
# ---------------------------------------------------------------------------

# Full regression suite (about 2,000 tests). Same install and command as the
# GitHub workflow: pinned constraints-ci.txt, no torch (the deep-model tests
# skip here and run in python-deep-model), and --durations lists the slowest.
python-unittest:
  extends: .python-base
  stage: test
  needs: []
  cache:
    key:
      files:
        - requirements-ci.txt
        - constraints-ci.txt
    paths:
      - .cache/pip
  variables:
    # check.sh aborts the run (with stack dumps) before the job timeout.
    CI_TEST_TIMEOUT: 50m
  script:
    - scripts/ci/install.sh
    - scripts/ci/check.sh tests
  timeout: 1h

# Deep-model tests need torch, which python-unittest leaves out. Runs in
# parallel so the torch install and training epochs stay off the main job.
python-deep-model:
  extends: .python-deps
  stage: test
  needs: []
  variables:
    QT_QPA_PLATFORM: offscreen
  script:
    - python -m unittest discover tests -p "test_deep_model.py"
  timeout: 30m

# Standalone TypeScript kernel/orientation checks (esbuild + node).
frontend-checks:
  extends: .frontend-base
  stage: test
  needs: []
  script:
    - npm run check:kernel
    - npm run check:orientation

# ---------------------------------------------------------------------------
# build
# ---------------------------------------------------------------------------

# tsc -b && vite build. Flask serves the built dist/, so keep it as an artifact.
frontend-build:
  extends: .frontend-base
  stage: build
  # Only wait for lint, not the slow Python test job.
  needs:
    - frontend-lint
  script:
    - npm run build
  artifacts:
    paths:
      - web_frontend/dist/
    expire_in: 1 week
